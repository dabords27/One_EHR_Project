  <style>
    /* System font: Modern Sans-Serif */
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Dedicated font for clinical forms as per client requirement */
    .medical-font {
      font-family: 'Calibri', 'Candara', 'Segoe UI', 'Optima', 'Arial', sans-serif;
    }
    
    /* Custom Square Checkbox Styling */
    .square-check {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid #334155;
      background-color: transparent;
      display: inline-block;
      position: relative;
      cursor: pointer;
      border-radius: 0 !important;
      flex-shrink: 0;
    }

    .square-check:checked {
      background-color: #334155;
    }

    .square-check:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 0px;
      width: 5px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* Print styles */
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background: white !important;
      }
    }
  </style>
